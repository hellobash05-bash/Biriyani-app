<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Biriyani Royale</title>
    <script type="text/javascript">
      // Simple Page App Redirect for GitHub Pages
      var l = window.location;
      // pathSegmentsToKeep = 1 because the repo is /Biriyani-app/
      var pathSegmentsToKeep = 1;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="text-align:center; margin-top: 20%;">
       <h1 style="font-family: sans-serif; color: #f97316;">ROYALE REDIRECT</h1>
       <p style="font-family: sans-serif; color: #666;">Authenticating your culinary journey...</p>
    </div>
  </body>
</html>
