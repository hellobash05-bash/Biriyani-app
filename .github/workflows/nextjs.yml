    1 name: Deploy Next.js site to Pages
    2
    3 on:
    4   push:
    5     branches: ["main"]
    6   workflow_dispatch:
    7
    8 permissions:
    9   contents: read
   10   pages: write
   11   id-token: write
   12
   13 concurrency:
   14   group: "pages"
   15   cancel-in-progress: false
   16
   17 jobs:
   18   build:
   19     runs-on: ubuntu-latest
   20     steps:
   21       - name: Checkout
   22         uses: actions/checkout@v4
   23       
   24       - name: Setup Node
   25         uses: actions/setup-node@v4
   26         with:
   27           node-version: "20"
   28           cache: 'npm'
   29           
   30       - name: Install dependencies
   31         run: npm ci
   32         
   33       - name: Build frontend
   34         run: npm run build --workspace=frontend
   35         env:
   36           NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
   37           
   38       - name: Upload artifact
   39         uses: actions/upload-pages-artifact@v3
   40         with:
   41           path: ./frontend/out
   42
   43   deploy:
   44     environment:
   45       name: github-pages
   46       url: ${{ steps.deployment.outputs.page_url }}
   47     runs-on: ubuntu-latest
   48     needs: build
   49     steps:
   50       - name: Deploy to GitHub Pages
   51         id: deployment
   52         uses: actions/deploy-pages@v4

